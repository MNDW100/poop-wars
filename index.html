<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>푸프 워즈 (Poop Wars)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12101c;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#nm{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(10,8,20,.55)}
#nm .box{background:#221f3d;border:2px solid #FF4D8D;border-radius:16px;padding:26px 28px;text-align:center;color:#fff;width:min(340px,86vw);box-shadow:0 0 30px rgba(255,77,141,.4)}
#nm h2{margin:0 0 14px;font-size:20px}
#nm input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #5b5483;background:#12101c;color:#fff;font-size:17px;text-align:center;outline:none}
#nm button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#FF4D8D;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
#nm p{margin:12px 0 0;font-size:12px;color:#b9b3d6}
#dov{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(18,16,28,.8);color:#fff}
.dp{display:none;background:#221f3d;border:2px solid #00E5A8;border-radius:16px;padding:22px 26px;text-align:center;width:min(360px,88vw);max-height:92vh;overflow:auto}
.dp h2{margin:0 0 8px;font-size:26px}.dp .m{color:#b9b3d6;font-size:13px;margin:8px 0}
.dp button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:#FF4D8D;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.dp button.g{background:#3a3560}
.dp ol{text-align:left;padding-left:30px;margin:8px 0;line-height:1.9;font-size:15px}
.dp li.me{color:#ffd23f;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nm"><div class="box"><h2>💩 닉네임을 입력하세요</h2><input id="nmi" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="off"><button id="nmb">확인</button><p>전체 랭킹에 이 이름으로 표시돼요</p></div></div>
<div id="dov">
 <div class="dp" id="dEnd"><h2 id="dT"></h2><div class="m" id="dS"></div><div class="m" id="dM"></div><button id="dAgain">다시 대결</button><button class="g" id="dRk">🏆 DUEL 랭킹</button><button class="g" id="dMenu">메인으로</button></div>
 <div class="dp" id="dRank"><h2>🏆 DUEL 승리 랭킹</h2><div class="m" id="dRm"></div><ol id="dRl"></ol><button class="g" id="dBack">돌아가기</button></div>
</div>
<script>
"use strict";
const MAP = 2400, T = 20, N = MAP / T, GAME_TIME = 240;
const PINK = '#FF4D8D', MINT = '#00E5A8';
const TCOL = [null, PINK, MINT], TFILL = [null, 'rgba(255,77,141,.5)', 'rgba(0,229,168,.5)'];
const MMCOL = [null, '#FF4D8D', '#00E5A8'];
const GAP = 16, HEAD_R = 13, BASE_SPEED = 205, TURN = 4.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- Grid + offscreen layers ----------
const floor = document.createElement('canvas'); floor.width = floor.height = MAP;
const fctx = floor.getContext('2d');
const mm = document.createElement('canvas'); mm.width = mm.height = N;
const mctx = mm.getContext('2d');
let grid, counts;

function resetGrid() {
  grid = Array.from({ length: N }, () => new Uint8Array(N));
  counts = [N * N, 0, 0];
  fctx.clearRect(0, 0, MAP, MAP); mctx.clearRect(0, 0, N, N);
}
function paintTile(x, y, team) {
  if (x < 0 || y < 0 || x >= N || y >= N) return 0;
  const prev = grid[x][y];
  if (prev === team) return 0;
  grid[x][y] = team; counts[prev]--; counts[team]++;
  fctx.clearRect(x * T, y * T, T, T);
  fctx.fillStyle = TFILL[team]; fctx.fillRect(x * T, y * T, T, T);
  mctx.clearRect(x, y, 1, 1);
  mctx.fillStyle = MMCOL[team]; mctx.fillRect(x, y, 1, 1);
  return 1;
}
function paintArea(px, py, team, r) { // (2r+1)x(2r+1) tiles
  const cx = Math.floor(px / T), cy = Math.floor(py / T);
  let n = 0;
  for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) n += paintTile(cx + i, cy + j, team);
  return n;
}
function tileAt(x, y) {
  const gx = Math.min(N - 1, Math.max(0, Math.floor(x / T))), gy = Math.min(N - 1, Math.max(0, Math.floor(y / T)));
  return grid[gx][gy];
}

// ---------- Entity ----------
const BASES = [null, { x: 300, y: 300 }, { x: 2100, y: 2100 }];
class Entity {
  constructor(team, isBot, name) {
    this.team = team; this.isBot = isBot; this.name = name;
    this.score = 0; this.kills = 0; this.painted = 0; this.respawn = 0; this.spawn();
  }
  spawn() {
    const b = BASES[this.team];
    this.x = b.x + (Math.random() - .5) * 300; this.y = b.y + (Math.random() - .5) * 300;
    this.angle = Math.atan2(1200 - this.y, 1200 - this.x);
    this.length = 8; this.gauge = 60; this.alive = true; this.boosting = false;
    this.fruit = null; this.active = null; this.orbs = null; this.burn = 0; this.frozen = 0; this.iceSlow = 0; this.invincible = false; this.useT = 1 + Math.random() * 2; this.shockCd = 0;
    this.pathHistory = [{ x: this.x, y: this.y }]; this.segments = [];
    this.tx = this.x; this.ty = this.y; this.think = 0; this.botBoost = false; this.speed = CFG.speed;
    for (let i = 1; i <= this.length * 6; i++) // initial trail behind head
      this.pathHistory.push({ x: this.x - Math.cos(this.angle) * i * 3, y: this.y - Math.sin(this.angle) * i * 3 });
    this.rebuild();
  }
  rebuild() {
    const p = this.pathHistory, s = this.segments; s.length = 0;
    let acc = 0, next = GAP, i = 1;
    for (; i < p.length && s.length < this.length; i++) {
      acc += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
      if (acc >= next) { s.push(p[i]); next += GAP; }
    }
    if (s.length >= this.length) p.length = Math.min(p.length, i + 2);
  }
  tail() { return this.segments.length ? this.segments[this.segments.length - 1] : this; }
  die() {
    if (this.active && this.active.onExit) this.active.onExit(this, this.active);
    this.active = null; this.invincible = false; this.orbs = null; this.fruit = null;
    this.alive = false; this.respawn = CFG.respawn;
    for (let i = 0; i < this.segments.length; i += 2) {
      if (foods.length > CFG.foods + 140) break;
      const s = this.segments[i]; foods.push(makeFood(s.x, s.y, 0));
    }
  }
  update(dt, input) {
    // steering
    let target;
    if (this.isBot) { this.botAI(dt); target = Math.atan2(this.ty - this.y, this.tx - this.x); this.boosting = this.botBoost && this.gauge > 0; }
    else { target = Ctl.target(this, input.wx, input.wy); Ctl.shown = target; this.boosting = (input.down || Ctl.shift) && this.gauge > 0; }
    if (this.frozen > 0) { this.frozen -= dt; this.boosting = false; return; }
    const wind = this.active && this.active.type === 'wind';
    let d = target - this.angle; d = Math.atan2(Math.sin(d), Math.cos(d));
    const m = CFG.turn * (wind ? 2 : 1) * dt; this.angle += Math.max(-m, Math.min(m, d));
    // terrain
    const t = tileAt(this.x, this.y), own = t === this.team, enemy = t !== 0 && !own;
    let sp = CFG.speed * (own ? 1.25 : enemy ? 0.7 : 1);
    if (wind) sp *= 1.6;
    if (this.burn > 0) { sp *= .6; this.gauge = Math.max(0, this.gauge - 25 * dt); this.burn -= dt; }
    if (this.iceSlow > 0) { sp *= .6; this.iceSlow -= dt; }
    if (this.boosting) { sp *= 1.5; this.gauge -= 20 * (enemy ? 1.5 : 1) * dt; if (this.gauge <= 0) { this.gauge = 0; this.boosting = false; } }
    else if (own) this.gauge = Math.min(100, this.gauge + 15 * dt);
    this.speed = sp;
    // move
    this.x += Math.cos(this.angle) * sp * dt; this.y += Math.sin(this.angle) * sp * dt;
    this.x = Math.max(HEAD_R, Math.min(MAP - HEAD_R, this.x)); this.y = Math.max(HEAD_R, Math.min(MAP - HEAD_R, this.y));
    const p0 = this.pathHistory[0];
    if (Math.hypot(this.x - p0.x, this.y - p0.y) >= 3) this.pathHistory.unshift({ x: this.x, y: this.y });
    this.rebuild();
    // painting: tail leaves a 1-tile trail, boost paints 3x3
    const tl = this.tail(); this.painted += paintArea(tl.x, tl.y, this.team, this.boosting ? CFG.boostR : 0);
  }
  botAI(dt) {
    this.think -= dt;
    if (this.fruit && !this.active) {
      this.useT -= dt;
      if (this.useT <= 0) {
        this.useT = 1 + Math.random() * 2; let near = false;
        for (const o of entities) if (o.alive && o.team !== this.team && Math.hypot(o.x - this.x, o.y - this.y) < (this.fruit === 'blink' ? 150 : 380)) near = true;
        if (near || (this.fruit !== 'blink' && Math.random() < .3)) useFruit(this);
      }
    }
    if (this.think <= 0) {
      this.think = 0.25 + Math.random() * 0.25;
      let best = null, bd = 450 * 450;
      for (const f of foods) { const dd = (f.x - this.x) ** 2 + (f.y - this.y) ** 2; if (dd < bd) { bd = dd; best = f; } }
      if (best) { this.tx = best.x; this.ty = best.y; }
      else if (Math.hypot(this.tx - this.x, this.ty - this.y) < 80 || Math.random() < .2) { this.tx = 100 + Math.random() * 2200; this.ty = 100 + Math.random() * 2200; }
      this.botBoost = this.botBoost ? this.gauge > 15 : (this.gauge > 70 && Math.random() < .3);
    }
    // avoid enemy bodies / walls
    const ax = this.x + Math.cos(this.angle) * 80, ay = this.y + Math.sin(this.angle) * 80;
    for (const e of entities) {
      if (!e.alive || e.team === this.team) continue;
      for (const s of e.segments) if ((s.x - ax) ** 2 + (s.y - ay) ** 2 < 55 * 55) {
        const a = Math.atan2(s.y - this.y, s.x - this.x) + (Math.random() < .5 ? 2.2 : -2.2);
        this.tx = this.x + Math.cos(a) * 200; this.ty = this.y + Math.sin(a) * 200; this.think = 0.3; return;
      }
    }
    if (ax < 60 || ay < 60 || ax > MAP - 60 || ay > MAP - 60) { this.tx = 1200; this.ty = 1200; this.think = 0.4; }
  }
}

// ---------- Food ----------
const FOOD_TYPES = [
  { e: '🍎', grow: 1, gauge: 12 }, { e: '🌽', grow: 2, gauge: 20 },
  { e: '🍇', grow: 1, gauge: 15 }, { e: '🍓', grow: 1, gauge: 10 }
];
let foods = [];
function makeFood(x, y, t) { const ty = t === undefined ? Math.floor(Math.random() * 4) : t; return { x, y, ty, ...FOOD_TYPES[ty] }; }
function spawnFood() { foods.push(makeFood(40 + Math.random() * (MAP - 80), 40 + Math.random() * (MAP - 80))); }

// ---------- State ----------
let entities = [], player, timeLeft, over, winner;
const CLASSIC_CFG = { time: 180, respawn: 7, speed: 205, turn: 4.5, boostR: 1, foods: 180, team: 5 };
const CHAOS_CFG = { time: 120, respawn: 2.5, speed: 330, turn: 5.5, boostR: 2, foods: 300, team: 5 };
let CFG = CLASSIC_CFG, gameMode = 'classic', banner = { t: 0, text: '', color: '#fff' };
let selSkin = 'slime', screen = 'logo', loadP = 0, endT = 0, endG = false, rankRows = [], res = {}; let loadStart = 0; const logoStart = performance.now();
const input = { x: 0, y: 0, wx: 0, wy: 0, down: false };
const cam = { x: 0, y: 0 };
function init() {
  CFG = gameMode === 'chaos' ? CHAOS_CFG : CLASSIC_CFG;
  resetGrid(); foods = []; for (let i = 0; i < CFG.foods; i++) spawnFood();
  entities = [];
  player = new Entity(1, false, playerName || '플레이어'); entities.push(player);
  for (let i = 0; i < CFG.team - 1; i++) entities.push(new Entity(1, true, 'P' + i));
  for (let i = 0; i < CFG.team; i++) entities.push(new Entity(2, true, 'M' + i));
  paintArea(BASES[1].x, BASES[1].y, 1, 5); paintArea(BASES[2].x, BASES[2].y, 2, 5);
  timeLeft = CFG.time; over = false; sysInit();
  for (const e of entities) e.skin = e.isBot ? (Math.random() < .3 ? 'snow' : 'slime') : selSkin;
}
addEventListener('mousemove', e => { input.x = e.clientX; input.y = e.clientY; });
addEventListener('mousedown', e => {
  if (screen !== 'play') { if (e.button === 0) { if (screen === 'splash') showName(); else if (screen === 'menu') menuClick(e.clientX, e.clientY); else if (screen === 'global') screen = 'menu'; } return; }
  if (over && e.button === 0) { if (endT > .8) { if (endT < 7) endT = 7; else if (!endG) endG = true; else { screen = 'menu'; input.down = false; } } return; }
  if (e.button === 2) { if (gameMode === 'chaos' && player.alive) useFruit(player); return; }
  if (e.button === 0 && !Ctl.jdrag) input.down = true;
});
addEventListener('mouseup', e => { if (e.button === 0) input.down = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (screen === 'name') return;
  if (screen === 'splash' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); showName(); return; }
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (screen !== 'play' || e.repeat || over || !player.alive) return;
  if (gameMode === 'chaos') shockwave(player); // chaos: shockwave + area paint
  else player.length = Math.max(3, Math.floor(player.length / 2)); // classic: halve body (min 3)
});

// ---------- Update ----------
function update(dt) {
  if (over) { endT += dt; return; }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; over = true; winner = counts[1] === counts[2] ? 0 : counts[1] > counts[2] ? 1 : 2; endT = 0; finishMatch(); return; }
  input.wx = input.x + cam.x; input.wy = input.y + cam.y;
  for (const e of entities) {
    if (!e.alive) { e.respawn -= dt; if (e.respawn <= 0) e.spawn(); continue; }
    e.update(dt, input); tickFruit(e, dt);
    for (let i = foods.length - 1; i >= 0; i--) { // eat
      const f = foods[i];
      if ((f.x - e.x) ** 2 + (f.y - e.y) ** 2 < (HEAD_R + 12) ** 2) {
        foods.splice(i, 1); e.length = Math.min(70, e.length + f.grow); e.gauge = Math.min(100, e.gauge + f.gauge); e.score++;
      }
    }
  }
  while (foods.length < CFG.foods) spawnFood();
  sysUpdate(dt);
  // collisions: head vs enemy segments only; head-head kills both
  const dead = new Set();
  for (const a of entities) {
    if (!a.alive) continue;
    for (const b of entities) {
      if (b.team === a.team || !b.alive) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < HEAD_R * 2) {
        if (a.invincible && !b.invincible) { if (!dead.has(b)) a.kills++; dead.add(b); }
        else if (b.invincible && !a.invincible) { if (!dead.has(a)) b.kills++; dead.add(a); }
        else if (!a.invincible && !b.invincible) { dead.add(a); dead.add(b); }
        continue;
      }
      if (a.invincible) continue;
      for (const s of b.segments) if ((s.x - a.x) ** 2 + (s.y - a.y) ** 2 < (HEAD_R + 9) ** 2) { if (!dead.has(a)) b.kills++; dead.add(a); break; }
    }
  }
  sysKills(dead);
  dead.forEach(e => e.die());
}

// ---------- Render ----------
function drawEntity(e) { drawEntity0(e); if (e.boosting && e.alive !== false) sparkle(e, e.segments); }
function drawEntity0(e) {
  if (e.skin === 'snow') return drawSnow(e);
  const c = TCOL[e.team], n = e.segments.length;
  ctx.shadowColor = c; ctx.shadowBlur = e.boosting ? 22 : 10; ctx.fillStyle = c;
  for (let i = n - 1; i >= 0; i--) {
    const s = e.segments[i], r = 12 - 4 * (i / Math.max(1, n));
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(e.x, e.y, HEAD_R, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = n - 1; i >= 0; i -= 1) { const s = e.segments[i]; ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, 3, 0, 6.2832); ctx.fill(); }
  ctx.beginPath(); ctx.arc(e.x - 4, e.y - 4, 4.5, 0, 6.2832); ctx.fill();
  const ca = Math.cos(e.angle), sa = Math.sin(e.angle);
  for (const k of [-1, 1]) { // eyes
    const ex = e.x + ca * 5 - sa * 6 * k, ey = e.y + sa * 5 + ca * 6 * k;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(ex + ca * 1.5, ey + sa * 1.5, 2, 0, 6.2832); ctx.fill();
  }
  if (e === player) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, HEAD_R + 4, 0, 6.2832); ctx.stroke(); }
}
let specT = null;
function focusTarget() {
  if (player.alive) { specT = null; return player; }
  if (!specT || !specT.alive || specT.team !== player.team) specT = entities.find(e => e.alive && e.team === player.team && e !== player) || player;
  return specT;
}
function render() {
  ctx.fillStyle = '#1a1730'; ctx.fillRect(0, 0, W, H);
  const fo = focusTarget();
  cam.x = Math.max(0, Math.min(MAP - W, fo.x - W / 2)); cam.y = Math.max(0, Math.min(MAP - H, fo.y - H / 2));
  if (W > MAP) cam.x = (MAP - W) / 2; if (H > MAP) cam.y = (MAP - H) / 2;
  ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  ctx.fillStyle = '#221f3d'; ctx.fillRect(0, 0, MAP, MAP);
  // floor: one drawImage of the visible region
  const sx = Math.max(0, cam.x), sy = Math.max(0, cam.y), sw = Math.min(MAP - sx, W), sh = Math.min(MAP - sy, H);
  ctx.drawImage(floor, sx, sy, sw, sh, sx, sy, sw, sh);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(sx / 100) * 100; x <= sx + sw; x += 100) { ctx.moveTo(x, sy); ctx.lineTo(x, sy + sh); }
  for (let y = Math.floor(sy / 100) * 100; y <= sy + sh; y += 100) { ctx.moveTo(sx, y); ctx.lineTo(sx + sw, y); }
  ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, MAP, MAP);
  sysDrawWorld();
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of foods) if (f.x > cam.x - 30 && f.x < cam.x + W + 30 && f.y > cam.y - 30 && f.y < cam.y + H + 30) ctx.fillText(f.e, f.x, f.y);
  for (const e of entities) if (e.alive && e.x > cam.x - 400 && e.x < cam.x + W + 400 && e.y > cam.y - 400 && e.y < cam.y + H + 400) { drawEntity(e); sysDrawEntity(e); }
  ctx.restore();
  if (!player.alive && !over) { ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, W, H); }
  drawUI(); if (!over) drawJoy();
}
function drawMinimap() {
  const S = 164, mx = W - 180, my = 16, k = S / MAP, now = performance.now();
  ctx.save();
  // background + tile layer
  ctx.fillStyle = 'rgba(12, 15, 26, 0.88)'; ctx.fillRect(mx, my, S, S);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(mm, mx, my, S, S); ctx.imageSmoothingEnabled = true;
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, S, S); ctx.clip();
  // inner cross guidelines
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(mx + S / 2, my); ctx.lineTo(mx + S / 2, my + S); ctx.moveTo(mx, my + S / 2); ctx.lineTo(mx + S, my + S / 2); ctx.stroke();
  // team bases: ring + tiny house
  for (const t of [1, 2]) {
    const bx = mx + BASES[t].x * k, by = my + BASES[t].y * k;
    ctx.fillStyle = 'rgba(12,15,26,.9)'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = TCOL[t]; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(bx - 4.5, by - .5); ctx.lineTo(bx, by - 4.5); ctx.lineTo(bx + 4.5, by - .5); ctx.closePath(); ctx.fill();
    ctx.fillRect(bx - 3, by - .5, 6, 4);
  }
  // camera viewport (same rectangle as the real screen)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(mx + cam.x * k, my + cam.y * k, W * k, H * k);
  ctx.restore();
  // outer outline
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)'; ctx.lineWidth = 3; ctx.strokeRect(mx - 1.5, my - 1.5, S + 3, S + 3);
  // markers: dead as translucent X, then living teammates/enemies
  for (const e of entities) {
    if (e === player) continue; const px = mx + (e.x / MAP) * S, py = my + (e.y / MAP) * S;

    for (const b of e.orbs) if (Math.hypot(o.x - b.x, o.y - b.y) < HEAD_R + 10) { dead.add(o); e.kills++; break; }
  }
}
function sysDrawWorld() {
  if (gameMode !== 'chaos') return;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of firePads) { ctx.globalAlpha = Math.min(1, p.t / 1.5) * .8; ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, 6.2832); ctx.fill(); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, 6.2832); ctx.fill(); }
  for (const w of waves) { ctx.globalAlpha = w.t / .5 * .45; ctx.fillStyle = '#9fe8ff'; ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.arc(w.x, w.y, 240, w.a - .6, w.a + .6); ctx.fill(); }
  for (const s of shocks) { const k = 1 - s.t / .5; ctx.globalAlpha = 1 - k; ctx.strokeStyle = TCOL[s.team]; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(s.x, s.y, 160 * k, 0, 6.2832); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.font = '26px serif'; const tt = performance.now();
  for (const f of fruitsOnMap) { ctx.fillStyle = 'rgba(170,80,255,' + (.25 + .15 * Math.sin(tt / 200)) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, 24, 0, 6.2832); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(FRUIT[f.type].icon, f.x, f.y); }
  ctx.restore();
}
function sysDrawEntity(e) {
  if (gameMode !== 'chaos') return;
  const t = performance.now(); ctx.save();
  if (e.invincible) { ctx.lineWidth = 4; for (let i = -1; i < e.segments.length; i++) { const s = i < 0 ? e : e.segments[i]; ctx.strokeStyle = 'hsl(' + ((t * .3 + i * 25) % 360) + ',100%,60%)'; ctx.beginPath(); ctx.arc(s.x, s.y, (i < 0 ? HEAD_R : 12) + 4, 0, 6.2832); ctx.stroke(); } }
  if (e.orbs) { ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = TCOL[e.team]; ctx.shadowBlur = 12; for (const o of e.orbs) ctx.fillText('💩', o.x, o.y); ctx.shadowBlur = 0; }
  if (e.active && e.active.type === 'ice') { ctx.strokeStyle = 'rgba(159,232,255,.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 180, 0, 6.2832); ctx.stroke(); }
  if (e.active && e.active.type === 'wind') { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; for (let k = 0; k < 3; k++) { const a = t / 150 + k * 2.0944; ctx.beginPath(); ctx.arc(e.x, e.y, 100, a, a + 1.2); ctx.stroke(); } }
  if (e.frozen > 0) { ctx.fillStyle = 'rgba(159,232,255,.55)'; ctx.beginPath(); ctx.arc(e.x, e.y, HEAD_R + 8, 0, 6.2832); ctx.fill(); ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.fillText('🧊', e.x, e.y - 24); }
  if (e.burn > 0) { ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText('🔥', e.x, e.y - 24); }
  ctx.restore();
}
function sysDrawHUD() {
  if (gameMode !== 'chaos' || !player) return;
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#d9a8ff'; ctx.fillText('⚡ CHAOS · 5 vs 5', 14, 18);
  if (banner.t > 0) { ctx.globalAlpha = Math.min(1, banner.t); ctx.textAlign = 'center'; ctx.font = 'bold 20px system-ui'; ctx.fillStyle = banner.color; ctx.fillText(banner.text, W / 2, H * .22); ctx.globalAlpha = 1; ctx.textAlign = 'left'; }
  const gx = 20, a = player.active, sy = H - 164, fy = H - 124;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(gx, sy, 260, 28); ctx.fillStyle = player.shockCd > 0 ? 'rgba(255,255,255,.2)' : 'rgba(255,77,141,.7)'; ctx.fillRect(gx, sy, 260 * (1 - player.shockCd / 3), 28);
  ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText('[Space] 충격파 ' + (player.shockCd > 0 ? player.shockCd.toFixed(1) + 's' : '준비 완료'), gx + 8, sy + 14);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(gx, fy, 260, 34); ctx.font = 'bold 14px system-ui';
  if (a) { ctx.fillStyle = 'rgba(170,80,255,.7)'; ctx.fillRect(gx, fy, 260 * Math.max(0, a.timer) / FRUIT[a.type].dur, 34); ctx.fillStyle = '#fff'; ctx.fillText(FRUIT[a.type].icon + ' ' + FRUIT[a.type].name + ' 발동 중 ' + Math.max(0, a.timer).toFixed(1) + 's', gx + 8, fy + 17); }
  else if (player.fruit) { ctx.fillStyle = '#d9a8ff'; ctx.fillText('[E/우클릭] ' + FRUIT[player.fruit].icon + ' ' + FRUIT[player.fruit].name, gx + 8, fy + 17); }
  else { ctx.fillStyle = '#9a94b8'; ctx.fillText('😈 악마의 열매를 먹어 보세요', gx + 8, fy + 17); }
  ctx.restore();
}

// ---------- Controls (arrow keys, joystick) + boost sparkle ----------
const Ctl = {
  mode: 'mouse', keys: {}, shift: false, shown: 0, kang: null, jang: 0, jdrag: false, mx: 0, my: 0, kx: 0, ky: 0,
  target(e, wx, wy) {
    if (this.mode === 'joy' && this.jdrag) return this.jang;
    if (this.mode === 'key') {
      const k = this.keys, dx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), dy = (k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0);
      if (dx || dy) this.kang = Math.atan2(dy, dx);
      return this.kang === null ? e.angle : this.kang;
    }
    return Math.atan2(wy - e.y, wx - e.x);
  }
};
function joyGeo() { const r = Math.min(58, W * .12), ms = 0; return { cx: W - 24 - r - ms, cy: H - r - 16, r }; }
function joyAt(e) { const g = joyGeo(); Ctl.jang = Math.atan2(e.clientY - g.cy, e.clientX - g.cx); }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Shift') Ctl.shift = true;
  if ((e.key === 'e' || e.key === 'E') && screen === 'play' && gameMode === 'chaos' && !over && player.alive) useFruit(player);
  if (e.key.indexOf('Arrow') === 0 && (screen === 'play' || screen === 'duel')) {
    e.preventDefault(); Ctl.keys[e.key] = true;
    if (Ctl.mode !== 'key') { Ctl.mode = 'key'; Ctl.kx = Ctl.mx; Ctl.ky = Ctl.my; Ctl.kang = null; }
  }
});
addEventListener('keyup', e => { if (e.key === 'Shift') Ctl.shift = false; if (e.key.indexOf('Arrow') === 0) Ctl.keys[e.key] = false; });
addEventListener('blur', () => { Ctl.keys = {}; Ctl.shift = false; });
addEventListener('mousemove', e => {
  Ctl.mx = e.clientX; Ctl.my = e.clientY; if (Ctl.jdrag) return;
  if (Ctl.mode === 'key' && Math.hypot(e.clientX - Ctl.kx, e.clientY - Ctl.ky) < 40) return;
  Ctl.mode = 'mouse';
});
addEventListener('pointerdown', e => {
  if (screen !== 'play' && screen !== 'duel') return;
  const g = joyGeo(); if (Math.hypot(e.clientX - g.cx, e.clientY - g.cy) < g.r * 1.3) { Ctl.jdrag = true; Ctl.mode = 'joy'; joyAt(e); }
});
addEventListener('pointermove', e => { if (Ctl.jdrag) joyAt(e); });
addEventListener('pointerup', () => { if (Ctl.jdrag) { Ctl.jdrag = false; Ctl.kang = Ctl.jang; Ctl.mode = 'key'; Ctl.kx = Ctl.mx; Ctl.ky = Ctl.my; } });
function drawJoy() {
  const g = joyGeo(), a = Ctl.shown, active = Ctl.jdrag || Object.values(Ctl.keys).some(v => v);
  const kx = g.cx + Math.cos(a) * g.r * .62, ky = g.cy + Math.sin(a) * g.r * .62;
  ctx.save(); ctx.globalAlpha = .9;
  ctx.fillStyle = 'rgba(20,16,40,.45)'; ctx.strokeStyle = active ? PINK : 'rgba(255,255,255,.4)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.r, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('\u25b2', g.cx, g.cy - g.r + 10); ctx.fillText('\u25bc', g.cx, g.cy + g.r - 10); ctx.fillText('\u25c0', g.cx - g.r + 10, g.cy); ctx.fillText('\u25b6', g.cx + g.r - 10, g.cy);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(g.cx, g.cy); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.fillStyle = PINK; ctx.shadowColor = PINK; ctx.shadowBlur = active ? 16 : 8;
  ctx.beginPath(); ctx.arc(kx, ky, g.r * .3, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(kx - 4, ky - 4, g.r * .09, 0, 6.2832); ctx.fill();
  ctx.restore();
}
function star(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); }
function sparkle(e, segs) {
  const t = performance.now(), n = segs.length; ctx.save();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < n; i++) { const s = segs[i], w = .5 + .5 * Math.sin(t * .02 - i * .8); ctx.globalAlpha = .08 + .3 * w; ctx.beginPath(); ctx.arc(s.x, s.y, 10 - 3 * i / Math.max(1, n), 0, 6.2832); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  for (let i = -1; i < n; i++) {
    const s = i < 0 ? e : segs[i], ph = Math.sin(t * .018 + i * 1.7); if (ph < .3) continue;
    const q = Math.floor(t / 90), ox = Math.sin(i * 12.9 + q) * 8, oy = Math.cos(i * 7.1 + q) * 8;
    ctx.fillStyle = i % 3 === 0 ? '#ffe9a8' : '#fff'; star(s.x + ox, s.y + oy, 2 + ph * 4);
  }
  ctx.restore();
}

// ---------- Loop ----------
init();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (screen === 'play') { update(dt); render(); } else if (screen === 'duel') { Duel.update(dt); Duel.render(now); } else menuScreen(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
